[tools]
node = "22"
pnpm = "10.28.2"
bun = "1.4.4"

[tasks.editor]
description = "Run the editor with hot reload and a disposable feature playground"
dir = "{{config_root}}"
env = { DOOC_USER_DIR = "{{config_root}}/build/dev/editor/.dooc/user" }
usage = 'flag "--port <port>" default="3000"'
run = [
  "node --import tsx scripts/dev-workspace.ts editor",
  "pnpm exec tsx watch --clear-screen=false --include './packages/frontend/src/**' --include './packages/workspace/src/**' packages/server/src/cli.ts editor run node --client --server --mcp --reader-plugins ./sample/examples/reader-plugins/index.mjs --project build/dev/editor --port \"$usage_port\"",
]

[tasks.reader]
description = "Run the reader with hot reload and a fresh disposable workspace"
dir = "{{config_root}}"
usage = 'flag "--port <port>" default="3001"'
run = [
  "node --import tsx scripts/dev-workspace.ts reader",
  "pnpm exec tsx watch --clear-screen=false --include './packages/frontend/src/**' --include './packages/workspace/src/**' packages/server/src/cli.ts reader run node --client --server --project build/dev/reader --port \"$usage_port\"",
]

[tasks.dooc]
description = "Run the source CLI. e.g. mise run dooc editor run node --all --project dooc-docs"
raw_args = true
dir = "{{cwd}}"
# The package.json script owns the entry path and keeps the caller's directory.
run = 'pnpm --silent --dir "{{config_root}}" run dooc'

[tasks.packed]
description = "Build and run the packaged CLI. e.g. mise run packed reader run node --all --project dooc-docs"
raw_args = true
dir = "{{cwd}}"
# The cache is disabled so every run installs the files that were just built.
run = 'pnpm --silent --dir "{{config_root}}" run build >&2 && pnpm --silent --config.dlx-cache-max-age=0 dlx "file:{{config_root}}"'

[tasks.release]
description = "Bump and publish dooc or dooc-plugin through GitHub Actions"
usage = '''
arg "<package>" {
  choices "dooc" "dooc-plugin"
}
arg "<bump>" {
  choices "patch" "minor" "major"
}
'''
run = 'node --import tsx scripts/release/release.ts "$usage_package" "$usage_bump"'

[tasks.binary]
description = "Build and test a standalone executable for this machine"
run = 'pnpm build && pnpm build:binary && pnpm test:binary'

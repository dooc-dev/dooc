[settings]
# `$` in [vars] is expanded by the shell that executes `run`, not by mise.
env_shell_expand = false

[tools]
node = "22"
pnpm = "10.28.2"
bun = "1.4.4"

# The manifest selects the project root. Relative paths use the invocation directory.
[vars]
resolve_manifest = 'r="$(if [ -n "$usage_manifest" ]; then cd "$MISE_ORIGINAL_CWD" && realpath -e "$usage_manifest"; else realpath -e sample/dooc.yaml; fi)"'
viewer_plugins = 'if [ "$r" = "$(realpath -e sample/dooc.yaml)" ]; then export DOOC_VIEWER_PLUGINS="${DOOC_VIEWER_PLUGINS:-$PWD/examples/viewer-plugins/index.mjs}"; fi'

[tasks.dev]
description = "Start the sample workspace, registered demo plugins and mock login with hot reload. e.g. mise run dev ../my-docs/dooc.yaml 5179"
usage = '''
arg "[manifest]" default=""
arg "[port]" default="5179"
'''
run = '{{vars.resolve_manifest}} && {{vars.viewer_plugins}} && pnpm exec tsx watch --clear-screen=false src/cli.ts edit "$r" "$usage_port"'

[tasks.view]
description = "Read-only docs viewer with document hot reload"
usage = '''
arg "[manifest]" default=""
arg "[port]" default="5179"
'''
run = '{{vars.resolve_manifest}} && {{vars.viewer_plugins}} && pnpm exec tsx watch --clear-screen=false src/cli.ts view "$r" "$usage_port"'

[tasks.edit]
description = "For editing content: start the viewer with live preview and external change detection. e.g. mise run edit ../my-docs/dooc.yaml"
usage = '''
arg "[manifest]" default=""
arg "[port]" default="5179"
'''
run = '{{vars.resolve_manifest}} && {{vars.viewer_plugins}} && pnpm exec tsx watch --clear-screen=false src/cli.ts edit "$r" "$usage_port"'

[tasks.build]
description = "Build bundle.html or bundle.zip from the manifest and its managed content"
usage = '''
arg "<format>" {
  choices "html" "zip"
}
arg "[manifest]" default=""
arg "[out]" default=""
flag "--url_preview <preview>" default="embed" {
  choices "embed" "network"
}
'''
run = '{{vars.resolve_manifest}} && pnpm exec tsx src/cli.ts build "$usage_format" "$r" ${usage_out:+"$(cd "$MISE_ORIGINAL_CWD" && realpath -m "$usage_out")"} --url_preview "$usage_url_preview"'

[tasks.release]
description = "Bump and publish dooc or dooc-plugin through GitHub Actions"
usage = '''
arg "<package>" {
  choices "dooc" "dooc-plugin"
}
arg "<bump>" {
  choices "patch" "minor" "major"
}
'''
run = 'node --import tsx scripts/release/release.ts "$usage_package" "$usage_bump"'

[tasks."build:binary"]
description = "Build and test a standalone executable for this machine"
run = 'pnpm build && pnpm build:binary && pnpm test:binary'

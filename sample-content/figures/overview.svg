<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" font-family="sans-serif" font-size="14">
  <title>Fig.overview</title>
  <desc>docs root → compiler → docs.json → viewer / consumer</desc>
  <g fill="var(--doc-panel, #ffffff)" stroke="var(--doc-border-2, #c4ccd8)">
    <rect x="10" y="40" width="110" height="40" rx="6"/>
    <rect x="160" y="40" width="110" height="40" rx="6"/>
    <rect x="310" y="40" width="200" height="40" rx="6"/>
  </g>
  <g fill="var(--doc-fg, #000000)" text-anchor="middle">
    <text x="65" y="65">docs root</text>
    <text x="215" y="65">compiler</text>
    <text x="410" y="65">docs.json → viewer</text>
  </g>
  <g stroke="var(--doc-accent, #1b4994)" stroke-width="2">
    <line x1="120" y1="60" x2="160" y2="60"/>
    <line x1="270" y1="60" x2="310" y2="60"/>
  </g>
</svg>

# .github/workflows/records.yaml in the repository that holds dooc.yaml
name: Docs and records
on:
  push:
    branches: [main]
  pull_request:

jobs:
  records:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.records.outputs.containers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dooc
        run: |
          curl -fsSL https://github.com/dooc-dev/dooc/releases/latest/download/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check pages, links, and embeds
        run: dooc check
      - name: Validate records against the schemas named in dooc.yaml
        id: records
        run: |
          npm install --no-save ajv ajv-formats smol-toml yaml
          node contents/mjs/records.mjs dooc.yaml > records.json
          echo "containers=$(jq -c '[.[] | select(.type == "container" and .data.runtime == "Kubernetes")]' records.json)" >> "$GITHUB_OUTPUT"
      - name: Build the standalone document
        run: dooc build html dooc.yaml site
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site/bundle.html

  deploy:
    needs: records
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        record: ${{ fromJSON(needs.records.outputs.containers) }}
    steps:
      - name: Roll out ${{ matrix.record.data.name }}
        env:
          IMAGE: ${{ matrix.record.data.image }}
          REPLICAS: ${{ matrix.record.data.replicas.min }}
        # Replace with the rollout command of your platform.
        run: echo "deploy $IMAGE with $REPLICAS replicas"

system:
  default_lang: eng
  files:
    default_layout: false
left_sidebar:
  title:
    eng: dooc
  icon:
    light: themes/light/contents/svg/_site.svg
    dark: themes/dark/contents/svg/_site.svg
center_contents:
  - file: contents/md/guide.md
    children:
      - file: contents/md/previews.md
        children:
          - file: contents/md/images.md
          - file: contents/md/data.md
          - file: contents/md/json-subformats.md
          - file: contents/md/code.md
          - file: contents/md/diagrams.md
          - file: contents/md/documents.md
          - file: contents/md/video.md
      - file: contents/md/plugins.md
  - file: contents/md/themes.md
  - subformat: issue
    title: issue
  - file: content/demo-page.md
json_subformats:
  - ext: issue
    format: yaml
    schema: contents/json/issue.schema.json
    layouts:
      card_title: title
  - ext: release
    format: json
    schema: contents/json/release.schema.json
    layouts:
      card_title: title
  - ext: experiment
    format: yaml
    schema: contents/json/experiment.schema.json
    layouts:
      card_title: title
  - ext: deployment
    format: toml
    schema: contents/json/deployment.schema.json
    layouts:
      card_title: title
default_subformat_folder: contents/issue

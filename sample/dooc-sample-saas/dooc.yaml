system:
  default_lang: eng
  files:
    default_layout: false
document:
  title: Field Notes · SaaS operations
  url: ""
  sidebar:
    title:
      eng: Field Notes · SaaS operations
  children:
    - document:
        title: Operations overview
        url: contents/md/index.md
    - document:
        title: System architecture
        url: contents/md/architecture.md
        children:
          - document:
              subformat: vpc
              title: Networks
          - document:
              subformat: loadbalancer
              title: Traffic
          - document:
              subformat: container
              title: Services
          - document:
              subformat: worker
              title: Workers
          - document:
              subformat: datastore
              title: Datastores
          - document:
              subformat: log
              title: Logs
    - document:
        title: Reliability & capacity
        url: contents/md/reliability.md
        children:
          - document:
              subformat: slo
              title: Service objectives
    - document:
        title: Incident response
        url: contents/md/runbooks.md
        children:
          - document:
              subformat: incident
              title: Incidents
    - document:
        title: Release & recovery
        url: contents/md/releases.md
    - document:
        title: Record pipeline
        url: contents/md/ci.md
    - document:
        title: Ownership
        url: contents/md/ownership.md
        children:
          - document:
              subformat: team
              title: Teams
json_subformats:
  - ext: team
    format: toml
    schema: contents/json/team.schema.json
    icon: contents/svg/icons/team.svg
    layouts:
      card_title: name
      group_by: focus
  - ext: vpc
    format: toml
    schema: contents/json/vpc.schema.json
    icon: contents/svg/icons/vpc.svg
    layouts:
      card_title: name
      group_by: provider
  - ext: loadbalancer
    format: yaml
    schema: contents/json/loadbalancer.schema.json
    icon: contents/svg/icons/loadbalancer.svg
    layouts:
      card_title: name
      group_by: scheme
  - ext: container
    format: yaml
    schema: contents/json/container.schema.json
    icon: contents/svg/icons/container.svg
    layouts:
      card_title: name
      group_by: runtime
  - ext: worker
    format: json
    schema: contents/json/worker.schema.json
    icon: contents/svg/icons/worker.svg
    layouts:
      card_title: name
      group_by: trigger
  - ext: datastore
    format: toml
    schema: contents/json/datastore.schema.json
    icon: contents/svg/icons/datastore.svg
    layouts:
      card_title: name
      group_by: kind
  - ext: log
    format: yaml
    schema: contents/json/log.schema.json
    icon: contents/svg/icons/log.svg
    layouts:
      card_title: name
      group_by: category
      sort_by: retention_days
      sort_order: desc
  - ext: slo
    format: yaml
    schema: contents/json/slo.schema.json
    layouts:
      card_title: name
      group_by: kind
  - ext: incident
    format: yaml
    schema: contents/json/incident.schema.json
    layouts:
      card_title: title
      group_by: status
      sort_by: started
      sort_order: desc
default_subformat_folder: contents/container

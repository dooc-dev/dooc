system:
  default_lang: eng
  files:
    default_layout: false
document:
  title: Atlas · Project delivery
  url: ""
  sidebar:
    title:
      eng: Atlas · Project delivery
  children:
    - document:
        title: Delivery overview
        url: contents/md/index.md
    - document:
        title: Roadmap & milestones
        url: contents/md/roadmap.md
        children:
          - document:
              subformat: project
              title: Projects
          - document:
              subformat: milestone
              title: Milestones
    - document:
        title: Work & acceptance
        url: contents/md/workflow.md
        children:
          - document:
              subformat: issue
              title: Issues
    - document:
        title: Decisions & reviews
        url: contents/md/decisions.md
        children:
          - document:
              subformat: note
              title: Notes
    - document:
        title: Record model
        url: contents/md/records.md
        children:
          - document:
              subformat: team
              title: Teams
json_subformats:
  - ext: team
    format: toml
    schema: contents/json/team.schema.json
    icon: contents/svg/icons/team.svg
    layouts:
      card_title: name
      group_by: focus
  - ext: project
    format: json
    schema: contents/json/project.schema.json
    icon: contents/svg/icons/project.svg
    layouts:
      card_title: name
      group_by: status
      sort_by: target
  - ext: milestone
    format: toml
    schema: contents/json/milestone.schema.json
    icon: contents/svg/icons/milestone.svg
    layouts:
      card_title: name
      group_by: state
      sort_by: due
  - ext: issue
    format: yaml
    schema: contents/json/issue.schema.json
    icon: contents/svg/icons/issue.svg
    layouts:
      card_title: title
      group_by: status
      sort_by: due
  - ext: note
    format: yaml
    schema: contents/json/note.schema.json
    icon: contents/svg/icons/note.svg
    layouts:
      card_title: title
      group_by: kind
      sort_by: date
      sort_order: desc
default_subformat_folder: contents/issue

<style>
  :root { --accent: #7062d9; --tint: #eeecfc; }
  .ticket { position: relative; }
  .ticket header { color: var(--muted); font-size: 10px; letter-spacing: .02em; }
  .orbit { color: var(--accent); font-size: 15px; line-height: 1; }
  .ticket h1 { font-weight: 550; }
  .ticket p { font-size: 11px; }
  .ticket .properties { margin: 10px 0; }
  .ticket select { max-width: 130px; padding: 3px 5px; border: 0; border-radius: 4px; color: var(--accent); background: var(--tint); font-size: 10px; }
  .ticket .label { padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; font-size: 10px; color: var(--muted); }
  .ticket footer { border-top: 1px solid var(--line); padding-top: 10px; }
  .ticket .avatar { color: var(--accent); background: var(--tint); }
  .checklist summary { color: var(--accent); font-size: 10px; }
  .checklist-panel { position: absolute; bottom: 44px; left: 12px; right: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); box-shadow: 0 6px 18px #0002; }
  .checklist-panel label { display: flex; align-items: center; gap: 8px; padding: 4px; color: var(--ink); font-size: 11px; }
  .checklist-panel input { accent-color: var(--accent); }
  .checklist-panel label:has(:checked) span { color: var(--muted); text-decoration: line-through; }
  @media (prefers-color-scheme: dark) { :root { --accent: #b1a6ff; --tint: #302c46; } }
</style>
<article class="ticket" lang="en">
  <header><span class="orbit" aria-hidden="true">◈</span><strong>Orbit</strong><span>/</span><span>{{project}}</span><span class="spacer">{{id}}</span></header>
  <h1>{{title}}</h1>
  <p>{{body}}</p>
  <div class="row properties"><select aria-label="Ticket status"><option selected>{{status}}</option><option>In review</option><option>Done</option></select><span class="label">{{priority}}</span><span class="label">{{label}}</span><span class="small spacer">{{cycle}}</span></div>
  <footer><span class="person"><span class="avatar" aria-hidden="true">{{initial}}</span>{{author}}</span><span class="small">{{due}}</span><details class="checklist spacer"><summary>Checklist</summary><div class="checklist-panel"><label><input type="checkbox" checked><span>{{task1}}</span></label><label><input type="checkbox" checked><span>{{task2}}</span></label><label><input type="checkbox" checked><span>{{task3}}</span></label><label><input type="checkbox"><span>{{task4}}</span></label><label><input type="checkbox"><span>{{task5}}</span></label></div></details></footer>
</article>

<style>
  :root { --accent: #8e4f87; --tint: #f4ebf3; }
  .chat > header { padding-bottom: 8px; border-bottom: 1px solid var(--line); color: var(--accent); font-size: 11px; }
  .chat-brand { font-size: 10px; font-weight: 600; letter-spacing: .04em; }
  .message { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 9px; margin-top: 10px; }
  .chat .avatar { width: 28px; height: 28px; border-radius: 6px; background: #e2b483; color: #633e31; font-size: 12px; }
  .message header { font-size: 11px; gap: 7px; }
  .message h1 { margin: 4px 0; font-size: 12px; letter-spacing: 0; }
  .message p { font-size: 11px; }
  .attachment { margin-top: 8px; padding: 6px 8px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px; }
  .attachment summary { font-size: 10px; font-weight: 550; }
  .attachment pre { margin: 5px 0 0; font: 10px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  .chat:has(.attachment[open]) .message-body { display: none; }
  .message footer { margin-top: 8px; gap: 5px; }
  .reaction { position: relative; display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 12px; font-size: 10px; }
  .reaction:has(:checked) { border-color: var(--accent); color: var(--accent); background: var(--tint); }
  .reaction:hover { border-color: var(--accent); }
  @media (prefers-color-scheme: dark) { :root { --accent: #d09cc7; --tint: #3c2a39; } }
</style>
<article class="chat" lang="en">
  <header><strong># {{channel}}</strong><span class="chat-brand spacer">chatter</span></header>
  <div class="message"><span class="avatar" aria-hidden="true">{{initial}}</span><div>
    <header><strong>{{author}}</strong><span class="small">{{time}}</span></header>
    <h1>{{title}}</h1>
    <p class="message-body">{{body}}</p>
    <details class="attachment"><summary>{{attachment}}</summary><pre>{{attachmentPreview}}</pre></details>
    <footer><label class="reaction"><input class="toggle-input" type="checkbox" aria-label="Acknowledge message"><span aria-hidden="true">✓</span><span class="when-off">{{acknowledgements}}</span><span class="when-on">{{acknowledgementsPlusOne}}</span></label><label class="reaction"><input class="toggle-input" type="checkbox" aria-label="Celebrate message"><span aria-hidden="true">✦</span><span class="when-off">{{celebrations}}</span><span class="when-on">{{celebrationsPlusOne}}</span></label><span class="small spacer">{{replies}} replies</span></footer>
  </div></div>
</article>

name: Release
run-name: Release ${{ inputs.bump }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID for the release command
        required: false
        type: string
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  binaries:
    if: github.repository == 'sasaki-s-sci/dooc' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/binaries.yml
  release:
    needs: binaries
    if: github.repository == 'sasaki-s-sci/dooc'
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Require the default branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Run Release from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
      - run: pnpm install --frozen-lockfile
      - name: Bump package version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "Invalid version increment" >&2; exit 1 ;;
          esac
          npm version "$BUMP" --no-git-tag-version --ignore-scripts --package-lock=false
          echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: pnpm check
      - uses: actions/download-artifact@v4
        with:
          pattern: dooc-*
          path: build/releases
          merge-multiple: true
      - name: Prepare checksums and Homebrew formula
        run: node scripts/prepare-release.mjs
      - name: Commit and tag release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json Formula/dooc.rb
          git commit -m "Release $TAG"
          git tag "$TAG"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG"
      - name: Publish private npm package ${{ steps.version.outputs.tag }}
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub release ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" build/releases/*.tar.gz build/releases/SHA256SUMS install.sh --draft --verify-tag --title "$TAG" --generate-notes
          gh release edit "$TAG" --draft=false --latest
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release
run-name: Release dooc ${{ inputs.bump }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID for the release command
        required: false
        type: string
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  binaries:
    if: github.repository == 'dooc-dev/dooc' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/binaries.yml
    with:
      bump: ${{ inputs.bump }}
  prepare:
    if: github.repository == 'dooc-dev/dooc' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Bump package version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "Invalid version increment" >&2; exit 1 ;;
          esac
          npm version "$BUMP" --no-git-tag-version --ignore-scripts --package-lock=false
          echo "tag=dooc-v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Pack tested npm package
        run: |
          mkdir -p build/packages
          npm pack --ignore-scripts --pack-destination build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            package.json
            build/packages/dooc-dev-dooc-*.tgz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
  release:
    needs: [binaries, prepare]
    if: github.repository == 'dooc-dev/dooc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Require the default branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Run Release from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: .
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: dooc-*
          path: build/releases
          merge-multiple: true
      - name: Prepare checksums
        working-directory: build/releases
        run: shasum -a 256 dooc-{darwin,linux}-{arm64,x64}.tar.gz > SHA256SUMS
      - name: Commit and tag release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          git commit -m "Release $TAG"
          git tag "$TAG"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG"
      - name: Publish npm package ${{ needs.prepare.outputs.tag }}
        run: npm publish "build/packages/dooc-dev-dooc-${TAG#dooc-v}.tgz" --ignore-scripts --access public
      - name: Publish GitHub release ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" build/releases/*.tar.gz build/releases/SHA256SUMS scripts/release/install.sh --draft --verify-tag --title "$TAG" --generate-notes
          gh release edit "$TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # After publishing, so the tap never points at archives that do not exist yet.
      - name: Update Homebrew formula and install example
        run: |
          node --import tsx scripts/release/formula.ts
          git add Formula/dooc.rb dooc-docs/contents/md/install.md
          git commit -m "Update Homebrew formula and install example for $TAG"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
